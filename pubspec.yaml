name: negocios_verdes_cdmb
description: "Negocios Verdes CDMB — Directorio y buscador de negocios verdes en los 13 municipios de la jurisdicción CDMB."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.17.1

  # Navegación
  go_router: ^17.5.0

  # Mapa (directorio + selector de ubicación en el admin)
  flutter_map: ^8.3.1
  flutter_map_marker_cluster: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.3

  # Imágenes
  image_picker: ^1.2.3
  cached_network_image: ^3.4.1

  # Utilidades
  intl: ^0.20.2
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  web: ^1.1.1

  # BUG FIX (ver CLAUDE.md de HuellaQR) — flutter_web_plugins vive dentro del
  # SDK de Flutter, no en pub.dev. Debe declararse como paquete de SDK igual
  # que flutter/flutter_localizations arriba; si una herramienta automática
  # lo reescribe como "flutter_web_plugins: any" rompe flutter pub get.
  flutter_web_plugins:
    sdk: flutter
  google_fonts: ^8.2.1
  http: ^1.6.0
  qr_flutter: ^4.1.0
  # Gráficas del panel /admin (barras, torta, líneas) — solo se usa ahí.
  fl_chart: ^1.1.1
  # Carga masiva de negocios: exportar/importar CSV desde /admin/negocios.
  csv: ^8.0.0
  file_picker: ^12.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # assets/images/logo.png es el ÚNICO archivo que hay que reemplazar para
  # cambiar el logo de toda la app (navbar, login admin, drawer admin,
  # inicio) — ver lib/core/widgets/logo_negocios_verdes.dart. Cualquier PNG
  # (idealmente con fondo transparente) sirve, no hace falta tocar código.
  assets:
    - assets/images/logo.png
    # Capas del geovisor (OSM, simplificadas). Ver assets/geo/README.md.
    - assets/geo/municipios_cdmb.geojson
    - assets/geo/areas_protegidas_cdmb.geojson
    - assets/geo/hidrografia_cdmb.geojson
    # Iconografía de marca (colibrí, frailejón, oso de anteojos, logos de
    # CDMB/Negocios Verdes/Feria Regional) para acentos decorativos en
    # varias páginas -- ver cada Image.asset para el porqué de cada spot.
    - assets/images/iconografia/
