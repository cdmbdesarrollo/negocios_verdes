<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!--
    SEO: exactamente UN <meta name="description">. HuellaQR tuvo un bug real
    por tener dos (rompió el snippet de Google) — no repetir ese error.
    Estos son los valores por defecto para la home y para bots que no
    ejecutan JavaScript (varios previsualizadores, notablemente el de
    WhatsApp, no lo hacen); cada página interna sobrescribe título/
    descripción en tiempo de ejecución vía lib/core/seo_tags.dart, lo que
    solo cubre crawlers que sí ejecutan JS. Pre-renderizado real por negocio
    queda para una fase futura (ver lib/migraciones/README.md / plan).
  -->
  <meta name="description" content="Directorio y buscador de negocios verdes en los 13 municipios de la jurisdicción de la CDMB (Corporación Autónoma Regional para la Defensa de la Meseta de Bucaramanga): agrosistemas, ecoturismo, apicultura y más.">
  <meta name="robots" content="index, follow">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Negocios Verdes CDMB">
  <meta property="og:title" content="Negocios Verdes CDMB">
  <meta property="og:description" content="Directorio y buscador de negocios verdes en los 13 municipios de la jurisdicción de la CDMB.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Negocios Verdes CDMB">
  <meta name="twitter:description" content="Directorio y buscador de negocios verdes en los 13 municipios de la jurisdicción de la CDMB.">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "GovernmentOrganization",
    "name": "CDMB — Corporación Autónoma Regional para la Defensa de la Meseta de Bucaramanga",
    "alternateName": "Negocios Verdes CDMB",
    "description": "Directorio y buscador de negocios verdes en los 13 municipios de la jurisdicción CDMB."
  }
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Negocios Verdes CDMB">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Negocios Verdes CDMB — Directorio de negocios verdes</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Sin service worker (se compila con --pwa-strategy=none). Además, si un
    visitante ya tenía registrado el SW por defecto de Flutter de un deploy
    anterior, hay que darlo de baja para que deje de servir la versión
    vieja cacheada ("no veo los cambios" tras cada deploy).
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- CanvasKit dibuja todo en un <canvas> — invisible para bots que no
       ejecutan JavaScript. Este texto es lo único que esos bots ven. -->
  <noscript>
    <h1>Negocios Verdes CDMB</h1>
    <p>Directorio y buscador de negocios verdes en los 13 municipios de la
      jurisdicción de la CDMB (Corporación Autónoma Regional para la
      Defensa de la Meseta de Bucaramanga). Activa JavaScript para usar el
      buscador.</p>
  </noscript>
</body>
</html>
