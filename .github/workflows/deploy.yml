name: Build y Deploy Negocios Verdes CDMB

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Compuerta de calidad: antes solo corria a mano despues de cada
      # cambio, sin nada que lo exigiera en el pipeline. flutter analyze
      # falla el paso (y el job) ante errores/warnings reales; los "info"
      # de estilo ya existentes no lo hacen fallar, asi que esto no bloquea
      # deploys por lints cosmeticos ya aceptados.
      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: Build Flutter Web
        run: flutter build web --release --source-maps -t lib/main.dart --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy a Vercel
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
